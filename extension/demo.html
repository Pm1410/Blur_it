    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .logo-text h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
    .logo-text p { font-size: 11px; color: var(--text-dim); }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .pill-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
      color: #c7d2fe;
    }

    .container {
      max-width: 680px;
      margin: 28px auto;
      padding: 0 16px;
    }

    /* Composer */
    .composer-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);

    .composer-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
    }

    .composer-meta { font-size: 13px; font-weight: 600; }
    .composer-meta span { color: var(--text-dim); font-size: 12px; font-weight: 400; }

    .editable-box {
      width: 100%;
      min-height: 80px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      resize: vertical;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .editable-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .composer-hints {
      font-size: 11px;
      color: var(--text-muted);
    }

      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 10px var(--accent-glow);
      transition: transform 0.15s;
    }
    .post-btn:hover { transform: translateY(-1px); }

    .feed-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .feed-count {
      font-size: 12px;
      color: var(--text-dim);
    }

      display: flex;
      flex-direction: column;
      gap: 14px;

      background: var(--card-bg);

      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .author-names span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .post-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;

      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.55;

      align-items: center;
      justify-content: center;
      background: #020617;

      width: 100%;

    }

    .post-actions {
      display: flex;
      gap: 20px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .post-action {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: color 0.15s;

      text-align: center;
      padding: 30px 0;
    }

      background: rgba(255, 255, 255, 0.06);

      color: var(--text);

      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;

    function getFilteredData() {
      if (currentFilter === "all") return POST_DATASET;
      return POST_DATASET.filter(p => p.type === currentFilter);
    }

    function renderPost(post) {
      const card = document.createElement("article");
      card.className = "aimi-post";
      card.setAttribute("data-aimi-post", "true");
      card.setAttribute("data-post-id", post.id);

      const tagClass = `tag-${post.type}`;
      const tagDisplay = showLabels ? "inline-block" : "none";

      let mediaHtml = "";
      if (post.img) {
        mediaHtml = `
          <div class="post-media">
            <img src="${post.img}" alt="Benchmark media ${post.id}">
          </div>
        `;
      }

      card.innerHTML = `
        <div class="post-header">
          <div class="author-info">
            <div class="avatar">${post.author.charAt(0)}</div>
            <div class="author-names">
              <h4>${post.author}</h4>
              <span>${post.handle} · ${post.time}</span>
            </div>
          </div>
          <span class="post-tag ${tagClass}" style="display:${tagDisplay}">${post.type}</span>
        </div>
        <div class="post-body" data-aimi-text="true">
          ${post.text}
        </div>
        ${mediaHtml}
        <div class="post-actions">
          <button class="post-action" type="button">💬 Reply</button>
          <button class="post-action" type="button">🔄 Retweet</button>
          <button class="post-action" type="button">❤️ Like</button>
          <button class="post-action" type="button">🔗 Share</button>
        </div>
      `;

      return card;
    }

    function loadNextBatch() {
      const list = getFilteredData();
      const nextBatch = list.slice(loadedCount, loadedCount + BATCH_SIZE);
      if (nextBatch.length === 0) {
        loadMoreBtn.textContent = "All Posts Loaded";
        loadMoreBtn.disabled = true;
        return;
      }

      nextBatch.forEach(post => {
        feedContainer.appendChild(renderPost(post));
      });

      loadedCount += nextBatch.length;
      countLabel.textContent = `Showing ${loadedCount} of ${list.length}`;

      if (loadedCount >= list.length) {
        loadMoreBtn.textContent = "All Posts Loaded";
        loadMoreBtn.disabled = true;
      } else {
        loadMoreBtn.textContent = "Load Next 15 Posts ↓";
        loadMoreBtn.disabled = false;
      }
    }

    function resetAndRender() {
      feedContainer.innerHTML = "";
      loadedCount = 0;
      loadNextBatch();
    }

    // Filter Buttons
    document.querySelectorAll(".filter-tabs .pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-tabs .pill-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        resetAndRender();
      });
    });

    loadMoreBtn.addEventListener("click", loadNextBatch);

    // Toggle Labels
    toggleLabelsBtn.addEventListener("click", () => {
      showLabels = !showLabels;
      toggleLabelsBtn.classList.toggle("active", showLabels);
      toggleLabelsBtn.textContent = showLabels ? "Show Tags" : "Hide Tags";
      document.querySelectorAll(".post-tag").forEach(tag => {
        tag.style.display = showLabels ? "inline-block" : "none";
      });
    });

    // Scroll button
    document.getElementById("scroll-bottom-btn").addEventListener("click", () => {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    });

    // Composer sandbox publish
    document.getElementById("composer-post-btn").addEventListener("click", () => {
      const box = document.getElementById("composer-editable");
      const text = box.innerText.trim();
      if (!text) return;

      // Create new clean post at the top
      const newPost = {
        id: Date.now(),
        type: "clean",
        author: "You (Draft Author)",
        handle: "@local_user",
        time: "Just now",
        text: text
      };

      const card = renderPost(newPost);
      feedContainer.prepend(card);
      box.innerText = "";
    });

    // Initial render
    resetAndRender();
  </script>
</body>
</html>
