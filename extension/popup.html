<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlurIt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon-wrapper">
          <svg class="brand-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">BlurIt</span>
          <span class="brand-tag">On-Device Shield</span>
        </div>
      </div>
      <div class="status-indicator-badge" id="status-badge">
        <span class="pulse-dot"></span>
        <span class="status-text" id="status-text">Active</span>
      </div>
    </header>

    <!-- Main Shield Card (Images) -->
    <section class="shield-card">
      <div class="shield-card-left">
        <span class="shield-heading">Visual Shield</span>
        <span class="shield-subheading" id="shield-subtext">Images scanned & blurred locally</span>
      </div>
      <label class="switch" aria-label="Toggle visual protection">
        <input type="checkbox" id="enable-toggle" checked>
        <span class="switch-slider"></span>
      </label>
    </section>

    <!-- Message Vibe Check Card -->
    <section class="shield-card" style="margin-top: 10px;">
      <div class="shield-card-left">
        <span class="shield-heading">Draft Vibe Check</span>
        <span class="shield-subheading" id="vibe-subtext">Pre-post toxicity & polite detox</span>
      </div>
      <label class="switch" aria-label="Toggle message vibe check">
        <input type="checkbox" id="vibe-toggle" checked>
        <span class="switch-slider"></span>
      </label>
    </section>

    <!-- Metrics Grid -->
    <section class="metrics-grid">
      <div class="metric-card">
        <span class="metric-label">Shielded</span>
        <span class="metric-value" id="stat-blurred">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Inspected</span>
        <span class="metric-value" id="stat-scanned">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Vibe Check</span>
        <span class="metric-value" id="stat-vibe">0</span>
      </div>
    </section>

    <!-- Sensitivity Control -->
    <section class="control-panel">
      <div class="control-header">
        <span class="control-title">Sensitivity Level</span>
        <span class="control-badge" id="threshold-val">Standard (30%)</span>
      </div>

      <!-- Preset Segmented Controls -->
      <div class="preset-group">
        <button type="button" class="preset-btn" data-val="0.45">Relaxed</button>
        <button type="button" class="preset-btn active" data-val="0.30">Standard</button>
        <button type="button" class="preset-btn" data-val="0.20">Strict</button>
      </div>

      <div class="slider-wrapper">
        <input type="range" id="threshold-slider" min="0.10" max="0.60" step="0.05" value="0.30" aria-label="Sensitivity threshold">
      </div>
    </section>

    <!-- Privacy Guarantee Footer -->
    <footer class="app-footer">
      <div class="privacy-note">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>100% On-Device Neural Processing</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
